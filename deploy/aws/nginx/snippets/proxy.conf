# Headers sent to the api and web containers. Included in each location that proxies.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Exactly one address, the visitor's. The plan's $proxy_add_x_forwarded_for would keep whatever the visitor sent
# in this header, and the API (TRUST_PROXY=true) believes it: a visitor could pick an address to dodge the rate limit.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;

# Place headers: Vercel's are never real here, Cloudflare's only from Cloudflare. An empty value removes the header.
proxy_set_header X-Vercel-Ip-Country "";
proxy_set_header X-Vercel-Ip-Country-Region "";
proxy_set_header X-Vercel-Ip-City "";
proxy_set_header Cf-Ipcountry $cf_country;
proxy_set_header Cf-Region-Code $cf_region;
proxy_set_header Cf-Ipcity $cf_city;

# The website sets some of the security headers itself; nginx sends its own, so drop the website's to avoid doubles.
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Strict-Transport-Security;
