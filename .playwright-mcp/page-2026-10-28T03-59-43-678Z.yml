                            - generic [ref=e630]: 六地蔵石仏
                            - generic [ref=e631]: 御所市大字櫛羅の山麓沿いに鎮座する、鴨山口神社から旧道の坂道を、葛城山に向かって少し歩くと、集落のはずれに行く手を阻むように、大きな石がどっかりと腰をおろしています。 この地域は古代から中世にかけて、兄川の出水等により、度々災害が発生し、伝承によれば、六地蔵が彫られた大きな石も、室町時代に土石流が発生し、現在の場所に流れ着いたと言われ、その大災害に対し、村人は仏教の六道をもって衆生を救うという、仏法の精神に照らし極楽浄土を願い、その頃に彫ったと思われます。 現在の櫛羅は中世には、倶尸羅を用い、葛城山を急激に下る土砂崩れが度々発生したため、（大和志にも白砂がある）崩れが語源となっています。村人の強い信仰心から大きな石に刻んだものと考えられ、向かって右から天上道（日光菩薩）人間道（除蓋障菩薩）修羅道（持地菩薩）畜生道（宝印菩薩）餓鬼道（宝珠菩薩）地獄道（壇蛇菩薩）となっています。
