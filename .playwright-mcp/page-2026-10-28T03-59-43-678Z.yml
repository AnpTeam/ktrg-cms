                - generic [ref=e111]: 大和葛城山麓の「葛城の道」を歩き、名柄バス停から葛城水分神社へ向かって第22経塚を遥拝します。その後、道標に従って一言の願いを叶える葛城一言主神社や千体石仏の九品寺、第23経塚がある六体地蔵石仏へと田園風景の中を巡ります。最後は鴨山口神社を経て近鉄御所駅方面へ下り、御所まちの古い町並みを抜けて役行者ゆかりの吉祥草寺へ至り、玉手駅から帰路につく散策ルートです。
                - generic [ref=e115]:
                  - heading "歴史・由来" [level=2] [ref=e116]
                  - generic [ref=e117]: 葛城の道は、大和朝廷が成立する以前の神話と古代王朝の足跡を辿る道であり、山の辺の道と並び、奈良盆地をめぐる古道として知られ、山容と田んぼのある風景をそこここに見ることができる。 葛城の道歴史文化館ではこの地方の古くからの風土やその歴史を知ることができる。また、この館は葛城の道の優れた歴史や自然の財産を、地域の人たちとともに守っていくための拠点としても機能している。
