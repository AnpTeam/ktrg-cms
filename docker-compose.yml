services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ktrg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ktrg_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-ktrg}
      TZ: Asia/Tokyo
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: run the apps in containers too.
  #   docker compose --profile app up --build
  # Day to day, run `bun run dev` on the host and start only the db.
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ktrg}:${POSTGRES_PASSWORD:-ktrg_dev_password}@db:5432/${POSTGRES_DB:-ktrg}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
