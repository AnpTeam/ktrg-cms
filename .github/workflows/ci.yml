name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ktrg
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ktrg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ktrg -d ktrg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://ktrg:ci_password@localhost:5432/ktrg_test
      APP_ORIGIN: http://localhost:3000
      MAIL_FROM: KTRG <no-reply@localhost>
      # Turns on the real-PostgreSQL tests (they skip when this is unset).
      TEST_DATABASE_URL: postgres://ktrg:ci_password@localhost:5432/ktrg_test
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Fails when a message has no English text (it would show Japanese on the English site); extracts first.
      - name: English strings are complete
        run: bun run --cwd apps/web check:catalogs

      # Fails when the schema files changed but no migration was written for it (run: bun run ktrg db generate <name>).
      - name: Migrations match the schema
        run: bun run ktrg db drift

      # Creates the tables in the CI database, so the tests below can also run the
      # real database stores (src/db/integration.test.ts) and not just in-memory copies.
      - name: Migrate test database
        run: bun run --cwd apps/api db:migrate:ci

      - name: Unit tests
        run: bun run test

  # Needs no database, so it runs beside `check` instead of after it.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      # Not `--if-present` from the root: the root has no build script, so that step did nothing.
      - name: Build (Next.js)
        run: bun run --cwd apps/web build
