name: Deploy to AWS

# After CI passes on main (or by hand: Actions → Deploy to AWS → Run workflow), does what deploy/aws/README.md does
# by hand: builds the API and website images for the server (ARM64, t4g.small), pushes them to ECR, uploads
# deploy/aws to S3, then runs deploy.sh on the server through Session Manager.
#
# GitHub signs in to AWS with OIDC (the role ktrg-github-deploy, made by deploy/aws/cicd-setup.sh): no AWS key is
# stored in GitHub. The role trusts main only, so this works once the workflow is on main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # to ask GitHub for the OIDC token AWS accepts
  contents: read

# One deploy at a time; a new one waits for the running one instead of cutting it off.
concurrency:
  group: deploy-aws
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-3
  AWS_ROLE: arn:aws:iam::712723095627:role/ktrg-github-deploy
  REGISTRY: 712723095627.dkr.ecr.ap-northeast-3.amazonaws.com
  BUCKET: ktrg-backups-712723095627
  SERVER: ktrg-cms # the server's Name tag
  # The commit CI tested (workflow_run), or main's newest (by hand).
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # Both images at once (matrix), on GitHub's ARM machines: built for ARM natively, no emulation.
  images:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - repo: ktrg-cms # API
            dockerfile: apps/api/Dockerfile
          - repo: ktrg-web # website
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build and push ${{ matrix.repo }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          provenance: false
          # The tag is the commit: every version can be traced back to its code (git show <tag>).
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.repo }}:${{ env.SHA }}
            ${{ env.REGISTRY }}/${{ matrix.repo }}:latest
          # Reuse unchanged layers (installed packages) from the last build: much faster.
          cache-from: type=gha,scope=${{ matrix.repo }}
          cache-to: type=gha,scope=${{ matrix.repo }},mode=max

  deploy:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2

      # The database image: postgres:18-alpine, copied into ECR as it is (both ARM and Intel versions).
      - name: Copy PostgreSQL into ECR
        run: docker buildx imagetools create -t "$REGISTRY/ktrg-db:18-alpine" postgres:18-alpine

      # The compose file, nginx config and scripts. .env* never leaves your PC (and is not in git anyway).
      - name: Upload deploy/aws to S3
        run: aws s3 sync deploy/aws "s3://$BUCKET/deploy/aws/" --exclude ".env*" --delete --only-show-errors

      # Session Manager runs two lines on the server as root, the same two you would type:
      #   aws s3 sync … /opt/ktrg/   and   ./deploy.sh <commit>
      # then this step waits for the result and prints the server's output.
      - name: Run deploy.sh on the server
        run: |
          params=$(jq -nc --arg b "$BUCKET" --arg t "$SHA" '{
            commands: [
              "set -euo pipefail",
              "cd /opt/ktrg",
              "aws s3 sync s3://\($b)/deploy/aws/ /opt/ktrg/ --only-show-errors",
              "chmod +x /opt/ktrg/*.sh",
              "./deploy.sh \($t)"
            ],
            executionTimeout: ["900"]
          }')
          id=$(aws ssm send-command --document-name AWS-RunShellScript \
            --targets "Key=tag:Name,Values=$SERVER" --comment "deploy ${SHA:0:12}" \
            --parameters "$params" --query Command.CommandId --output text)
          echo "Session Manager command $id"
          for _ in $(seq 1 90); do
            sleep 10
            status=$(aws ssm list-command-invocations --command-id "$id" --query 'CommandInvocations[0].Status' --output text)
            case "$status" in Pending|InProgress|Delayed|None|"") continue ;; esac
            break
          done
          aws ssm list-command-invocations --command-id "$id" --details \
            --query 'CommandInvocations[0].CommandPlugins[0].[Output]' --output text
          echo "status: $status"
          [ "$status" = Success ]
